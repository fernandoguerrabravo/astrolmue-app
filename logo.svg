<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- AstrOlmué Chile — marca: estrella con chupalla y órbita -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16244a"/><stop offset="1" stop-color="#080c18"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#g)"/>
  <!-- órbita -->
  <ellipse cx="64" cy="78" rx="46" ry="12" fill="none" stroke="#6EA8FF" stroke-width="2.5" opacity="0.55" transform="rotate(-16 64 78)"/>
  <!-- estrella -->
  <path fill="#F2B84B" stroke-linejoin="round"
        d="M64 44 L72.2 63.2 L93 64.9 L77.2 78.5 L82 98.8 L64 88 L46 98.8 L50.8 78.5 L35 64.9 L55.8 63.2 Z"/>
  <!-- órbita, tramo delantero sobre la estrella -->
  <path d="M27 92 A46 12 0 0 0 101 92" fill="none" stroke="#6EA8FF" stroke-width="2.5" opacity="0.9"
        transform="rotate(-16 64 78) translate(0 -14)"/>
  <!-- chupalla -->
  <g transform="translate(64 47) rotate(-7)">
    <ellipse cx="0" cy="0" rx="36" ry="7" fill="#A87A47"/>
    <path d="M-16 0.5 L-14.5 -17 Q0 -21 14.5 -17 L16 0.5 Z" fill="#8B5E34"/>
    <path d="M-15.3 -8 Q0 -11.5 15.3 -8 L15.6 -3.5 Q0 -7 -15.6 -3.5 Z" fill="#2F5AA8"/>
    <ellipse cx="0" cy="0" rx="36" ry="7" fill="none" stroke="#6E4A28" stroke-width="1.2"/>
  </g>
  <!-- punto de luz -->
  <circle cx="101" cy="30" r="2.2" fill="#DBE3F2"/>
  <circle cx="28" cy="36" r="1.5" fill="#DBE3F2" opacity="0.8"/>
</svg>
